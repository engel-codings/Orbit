/* PC-Modus: Querformat-Rahmen links/rechts, Vollbild, Tastatur-Hilfe (DE/EN/RU) */
(function () {
  var T = [
    { space: 'LEERTASTE', jump: 'Springen', click: 'Springen & Menüs', back: 'Pause / Zurück', fs: 'Vollbild', ctr: 'STEUERUNG', tips: 'TIPPS',
      t1: 'Sammle Sterne und schalte im Fähigkeitenbaum neue Kräfte frei.', t2: 'Online: 1 gegen 1 gegen echte Spieler – oder Bots auf deinem Niveau.', t3: 'PC-Modus lässt sich in den Optionen wieder ausschalten.', btn: 'Vollbild', mouse: 'Maus' },
    { space: 'SPACE', jump: 'Jump', click: 'Jump & menus', back: 'Pause / back', fs: 'Fullscreen', ctr: 'CONTROLS', tips: 'TIPS',
      t1: 'Collect stars and unlock new powers in the skill tree.', t2: 'Online: 1v1 against real players – or bots at your level.', t3: 'PC mode can be turned off again in the options.', btn: 'Fullscreen', mouse: 'Mouse' },
    { space: 'ПРОБЕЛ', jump: 'Прыжок', click: 'Прыжок и меню', back: 'Пауза / назад', fs: 'Полный экран', ctr: 'УПРАВЛЕНИЕ', tips: 'СОВЕТЫ',
      t1: 'Собирай звёзды и открывай новые силы в дереве навыков.', t2: 'Онлайн: 1 на 1 против игроков – или ботов твоего уровня.', t3: 'Режим ПК можно выключить в настройках.', btn: 'Полный экран', mouse: 'Мышь' }
  ];
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  window.orbitFullscreen = function (want) {
    try {
      var d = document.documentElement;
      if (want === undefined) want = !fsOn();
      if (want && !fsOn()) { (d.requestFullscreen || d.webkitRequestFullscreen).call(d); }
      else if (!want && fsOn()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    } catch (e) {}
  };
  var pending = false;
  function onFirst() { pending = false; window.orbitFullscreen(true); window.removeEventListener('pointerdown', onFirst, true); window.removeEventListener('keydown', onFirst, true); }
  window.orbitPc = function (on, lang, fs) {
    var t = T[lang] || T[0];
    document.body.classList.toggle('pc', !!on);
    var L = document.getElementById('pcL'), R = document.getElementById('pcR');
    if (on) {
      L.innerHTML = '<div class="pcLogo">ORBIT</div><div class="pcSub">PLANET JUMP</div><div class="pcH">' + t.ctr + '</div>' +
        '<div class="pcK"><span class="key">␣ ' + t.space + '</span><span>' + t.jump + '</span></div>' +
        '<div class="pcK"><span class="key">ENTER</span><span>' + t.jump + '</span></div>' +
        '<div class="pcK"><span class="key">' + t.mouse + '</span><span>' + t.click + '</span></div>' +
        '<div class="pcK"><span class="key">ESC</span><span>' + t.back + '</span></div>' +
        '<div class="pcK"><span class="key">F</span><span>' + t.fs + '</span></div>';
      R.innerHTML = '<div class="pcH">' + t.tips + '</div><div class="pcTip">' + t.t1 + '</div><div class="pcTip">' + t.t2 + '</div><div class="pcTip">' + t.t3 + '</div>' +
        '<button class="pcBtn" id="pcFs">⛶ ' + t.btn + '</button>';
      document.getElementById('pcFs').onclick = function () { window.orbitFullscreen(); };
      if (fs) window.orbitFullscreen(true);
      else if (!fsOn() && !pending) { pending = true; window.addEventListener('pointerdown', onFirst, true); window.addEventListener('keydown', onFirst, true); }
    } else {
      L.innerHTML = ''; R.innerHTML = '';
      if (pending) { pending = false; window.removeEventListener('pointerdown', onFirst, true); window.removeEventListener('keydown', onFirst, true); }
      if (fs) window.orbitFullscreen(false);
    }
    window.dispatchEvent(new Event('resize'));
  };
})();
</script>
</body>
</html>
